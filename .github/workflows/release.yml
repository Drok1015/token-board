name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 计算下一个版本号（最新 tag 的 patch +1），并判断本次 push 是否需要发布。
  # 跳过条件：提交信息含 [skip release]，或提交本身是机器人的 bump 提交（防循环，双保险）。
  check:
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.meta.outputs.next }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          LATEST=${LATEST#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "latest tag: v$LATEST -> next: v$NEXT"

          AUTHOR=$(git log -1 --format='%an')
          SUBJECT=$(git log -1 --format='%s')
          if [[ "$SUBJECT" == *"[skip release]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$AUTHOR" = "github-actions[bot]" ] && [[ "$SUBJECT" == chore:\ bump\ version* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.check.outputs.next }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 由机器人把所有版本文件同步为新版本并回写 main；
      # 用 GITHUB_TOKEN 推送不会再次触发 workflow，不会循环
      - name: Bump version and push back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          cd src-tauri && cargo metadata --format-version 1 > /dev/null && cd ..
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: bump version to $VERSION"
          git push origin main
          echo "BUMP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm run tauri build

      - name: Sign and zip
        run: |
          cd src-tauri/target/release/bundle/macos
          codesign --force --deep --sign - "Token 看板.app"
          codesign --verify "Token 看板.app"
          ditto -c -k --keepParent "Token 看板.app" "TokenBoard-v$VERSION-macos.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Token 看板 v${{ env.VERSION }}
          target_commitish: ${{ env.BUMP_SHA }}
          generate_release_notes: true
          make_latest: true
          files: src-tauri/target/release/bundle/macos/TokenBoard-v${{ env.VERSION }}-macos.zip
